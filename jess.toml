manifest_version = 1

[package]
id = "org.dreamweave.dreamwind-sql"
version = "0.1.1"
jess_api = "1"
include = ["src", "bench", "README.md"]
tests = ["tests/style.luau"]

[dependencies]
"org.dreamweave.tes3" = "0.1"
"org.dreamweave.nif" = "0.1"
"org.dreamweave.jessql" = "0.1.1"

[modules]
"@dreamwind-sql" = "src/init.luau"
"@dreamwind-sql/vfs" = "src/vfs.luau"
"@dreamwind-sql/tes3" = "src/tes3.luau"
"@dreamwind-sql/nif" = "src/nif.luau"

[[layer]]
id = "dream.sql"
requires = ["jessql.core", "tes3.core", "nif.core"]
exports = ["@dreamwind-sql", "@dreamwind-sql/vfs", "@dreamwind-sql/tes3", "@dreamwind-sql/nif"]
