# dreamwind-sql as a DreamWeave project: a Jess package. `jess` names the Package Source it
# publishes, the jess.toml at the repository root, and each release tag `dreamwind_sql-<version>` is one
# version of the package, packed by the Mod Template from that tag; every push packs a
# development build.
id = "24902fa8-2605-49b1-b278-5eb59a0f39b8"
slug = "dreamwind_sql"
type = "library"
status = "active"

[[maintainers]]
name = "DreamWeave"
url = "https://github.com/DreamWeave-MP"

[package]
format = "jpk"
jess = "org.dreamweave.dreamwind-sql"

[[releases]]
version = "0.1.1"
date = 2026-10-21
summary = "First release published as a DreamWeave project."
